<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数模资料库 · magic-hub</title>
  <meta name="description" content="数学建模资料库：真题、优秀论文、评分标准、知识讲解，按类型浏览或直接搜索。">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <!-- 顶栏：同款交互，初始透明融进 Hero，下滑变白 -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../index.html">magic<span>-hub</span></a>
      <div class="topbar-right">
        <nav class="topnav" aria-label="主导航">
          <a href="../index.html" class="topnav-link">首页</a>
          <a href="index.html" class="topnav-link is-current">数学建模</a>
          <a href="../edian/index.html" class="topnav-link">电子设计</a>
        </nav>
        <a class="member" href="../login.html">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6" fill="currentColor"/><path d="M4.5 19.5c1.2-3.4 4-5.2 7.5-5.2s6.3 1.8 7.5 5.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span class="member-text">会员中心</span>
        </a>
        <button class="search-toggle" type="button" aria-label="打开搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 全屏搜索层（紫光同款：顶栏放大镜点开，Esc / 关闭按钮 / 点遮罩退出） -->
  <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="站内搜索" hidden>
    <button class="search-close" type="button" aria-label="关闭搜索">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="search-panel">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="search-overlay-input" type="search" placeholder="搜索论文、题目、skill、评分标准…" aria-label="站内搜索">
      </div>
      <p class="search-hint">输入关键词，搜索本站全部可查内容</p>
      <div class="search-results" aria-live="polite"></div>
    </div>
  </div>

  <!-- 分区极简 Hero：给顶栏一个透明过渡的背景 -->
  <section class="hero sub-hero" id="hero">
    <div class="hero-inner">
      <p class="hero-tag">数学建模 · 资料库</p>
      <h1 class="hero-title">数模资料库</h1>
      <p class="hero-sub">真题、优秀论文、评分标准、知识讲解，按类型浏览或直接搜索。</p>
      <a class="btn-hero" href="#library-app" id="heroBtn">探索更多</a>
    </div>
  </section>

  <!-- data-zone 告诉 app.js 这是哪个区的资料库 -->
  <main class="wrap" id="library-app" data-zone="shumo">

    <!-- 面包屑（余力加练）：列表时末项是「资料库」，看详情时换成资料标题 -->
    <nav class="breadcrumb" aria-label="面包屑导航">
      <a href="../index.html">首页</a>
      <span class="crumb-sep">/</span>
      <a href="index.html">数学建模</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-current" aria-current="page">资料库</span>
    </nav>

    <!-- ============ 视图一：资料列表 ============ -->
    <section class="lib-list-view" aria-label="资料列表">
      <div class="lib-toolbar">
        <div class="lib-tabs" role="group" aria-label="按类型筛选">
          <button class="lib-tab" type="button" aria-pressed="true" data-cat="">全部</button>
        </div>
        <input class="filter-input lib-search" type="search" placeholder="搜索标题或关键词" aria-label="搜索资料">
      </div>
      <!-- 卡片容器：四种状态（加载/空/出错/正常）由 app.js 切换 -->
      <div class="card-grid" id="lib-grid" data-state="loading" aria-live="polite"></div>
    </section>

    <!-- ============ 视图二：资料详情（默认隐藏，地址带 #item=编号 时显示） ============ -->
    <section class="lib-detail-view" aria-label="资料详情" hidden>
      <article class="lib-detail">
        <p class="lib-detail-meta">
          <span class="lib-tag"></span>
          <span class="lib-year"></span>
        </p>
        <h2 class="lib-detail-title"></h2>
        <p class="lib-detail-summary"></p>

        <div class="lib-placeholder">
          <p class="state-title">资料全文还在整理</p>
          <p>先把标题与摘要放出来，方便你判断是否需要；正文与附件会在整理完成后补上。</p>
        </div>

        <!-- 余力加练：返回上一级视图（清掉地址里的 #item=编号） -->
        <a class="btn-retry lib-back" href="#library-app">← 返回资料列表</a>
      </article>
    </section>

  </main>

  <!-- 深色页脚（与首页同款） -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <p class="footer-logo">magic<span>-hub</span></p>
        <p class="footer-note">数学建模区 · 演示版</p>
      </div>
      <div class="footer-col">
        <p class="footer-head">本区</p>
        <a href="index.html">数学建模区首页</a>
        <a href="library.html">数模资料库</a>
      </div>
      <div class="footer-col">
        <p class="footer-head">说明</p>
        <a href="../index.html">网站首页</a>
        <span>内容会陆续补充</span>
      </div>
      <div class="footer-col">
        <p class="footer-head">文档</p>
        <span>开发文档记录在项目仓库</span>
        <span>本地运行方法见 README</span>
      </div>
    </div>
  </footer>

  <script src="../mock-data.js"></script>
  <script src="../app.js"></script>
</body>
</html>
