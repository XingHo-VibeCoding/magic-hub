  <path d="M668 614 L684 614" stroke="#b4b2a9" stroke-width="1.5"/>
  <path d="M684 609 L692 614 L684 619 Z" fill="#b4b2a9"/>

  <rect x="700" y="594" width="140" height="40" rx="8" fill="#ffffff" stroke="#e6e5e0"/>
  <text x="714" y="619" font-size="12" fill="#2c2c2a">页面返回并渲染</text>

  <text x="856" y="619" font-size="12" fill="#888780">全程本地</text>
